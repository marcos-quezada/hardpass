# HardPass dnsmasq config -- serves DHCP + DNS on the USB gadget
# interfaces only. Deliberately excludes wlan0 to never interfere with
# the real network's own DHCP/DNS infrastructure.

interface=usb0
interface=usb1
except-interface=wlan0
bind-dynamic

# Static per-MAC reservation -- the RNDIS host MAC (FreeBSD/Windows-
# style clients) and ECM host MAC (macOS/Linux-style clients) each get
# their own fixed address. Only one is ever actually active at a time
# (point-to-point link, not a real shared network), but dnsmasq
# requires distinct addresses per dhcp-host entry regardless.
dhcp-host=f6:67:ce:b3:c0:ee,10.18.1.41
dhcp-host=f6:67:ce:b3:c0:ed,10.18.1.42

# Small range as a fallback for any other client MAC not explicitly
# reserved above.
dhcp-range=10.18.1.100,10.18.1.110,255.255.255.0,12h

# Serve this device's own hostname locally -- no client-side
# /etc/hosts or real mDNS needed.
address=/hardpass.local/10.18.1.19

# Tell clients to use this device as their DNS server too.
dhcp-option=6,10.18.1.19

log-dhcp
