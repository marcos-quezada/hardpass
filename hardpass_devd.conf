# HARDPASS (Pi Zero W, Alpine, dual-config RNDIS/ECM gadget) attach --
# runs dhclient directly on attach. The standard /etc/devd/dhclient.conf
# mechanism doesn't work for this device: it triggers on LINK_UP, but
# FreeBSD's urndis(4) driver never fires that event at all (confirmed
# directly in its source -- no link_state/carrier tracking whatsoever,
# unlike real hardware). Matching ATTACH instead sidesteps this.
notify 100 {
	match "system"		"IFNET";
	match "subsystem"	"ue0";
	match "type"		"ATTACH";
	action "dhclient ue0 &";
};
